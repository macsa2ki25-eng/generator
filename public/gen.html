<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FIND ME">
<meta name="theme-color" content="#070605">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>発電機 - FIND ME</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="roughen">
    <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="n" seed="7"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
  </filter>
</svg>

<div class="fog"></div>

<main class="gen-stage">

  <!-- ===== 上部バー ===== -->
  <div class="topbar">
    <div>
      <div class="gen-label">発電機 <b id="genNo">-</b></div>
      <div id="noiseWarn" style="visibility:hidden; color:#e05548; font-size:clamp(11px,1.6vw,14px); letter-spacing:0.1em; margin-top:8px; animation:hintPulse 0.9s infinite;">⚠ 修理音が響いている…</div>
    </div>
    <div class="timer num" id="timer">--:--</div>
    <div class="others">
      <div class="other-gen" id="other0">
        <div class="og-head"><span class="og-name">発電機 -</span><span class="og-pct num">0%</span></div>
        <div class="pbar"><div class="fill"></div></div>
      </div>
      <div class="other-gen" id="other1">
        <div class="og-head"><span class="og-name">発電機 -</span><span class="og-pct num">0%</span></div>
        <div class="pbar"><div class="fill"></div></div>
      </div>
    </div>
  </div>

  <!-- ===== 発電機本体 ===== -->
  <div class="machine-wrap">
    <svg class="machine" id="machine" viewBox="0 0 640 500" aria-hidden="true">
      <defs>
        <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#96302c"/>
          <stop offset="0.5" stop-color="#71201d"/>
          <stop offset="1" stop-color="#4c1210"/>
        </linearGradient>
        <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a3c31"/>
          <stop offset="1" stop-color="#15160f"/>
        </linearGradient>
        <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#57534a"/>
          <stop offset="1" stop-color="#211f1a"/>
        </linearGradient>
        <linearGradient id="gRod" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7d786b"/>
          <stop offset="0.5" stop-color="#e0dccf"/>
          <stop offset="1" stop-color="#6e6858"/>
        </linearGradient>
        <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c8ffb0"/>
          <stop offset="0.5" stop-color="#6fbf5a"/>
          <stop offset="1" stop-color="#2e5c26"/>
        </linearGradient>
        <linearGradient id="gBrass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c9a45c"/>
          <stop offset="1" stop-color="#6e5226"/>
        </linearGradient>
        <radialGradient id="gLamp" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ffedb3" stop-opacity="0.95"/>
          <stop offset="0.5" stop-color="#ffd76e" stop-opacity="0.35"/>
          <stop offset="1" stop-color="#ffd76e" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gCone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe9ac" stop-opacity="0.5"/>
          <stop offset="1" stop-color="#ffe9ac" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="grunge">
          <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="4"/>
          <feColorMatrix type="matrix" values="0 0 0 0 0.03  0 0 0 0 0.02  0 0 0 0 0.015  0 0 0 0.65 0"/>
        </filter>
      </defs>

      <!-- 地面の影 -->
      <ellipse cx="320" cy="464" rx="255" ry="24" fill="#000" opacity="0.6"/>

      <!-- 垂れ下がるケーブル -->
      <path d="M150,0 C158,70 175,120 215,158" stroke="#14120f" stroke-width="5" fill="none"/>
      <path d="M565,0 C560,60 540,115 505,165" stroke="#171310" stroke-width="4" fill="none"/>
      <path d="M448,0 C446,60 452,120 458,185" stroke="#6b5a1e" stroke-width="4" fill="none"/>
      <path d="M245,470 C210,472 180,485 160,478" stroke="#191512" stroke-width="6" fill="none" opacity="0.9"/>
      <path d="M300,468 C330,478 360,488 410,480" stroke="#141110" stroke-width="6" fill="none" opacity="0.9"/>

      <!-- フレームの支柱 -->
      <rect x="98" y="46" width="15" height="404" rx="3" fill="url(#gMetal)" stroke="#0c0b09"/>
      <rect x="88" y="150" width="35" height="14" rx="3" fill="url(#gMetal)" stroke="#0c0b09"/>
      <rect x="527" y="26" width="15" height="424" rx="3" fill="url(#gMetal)" stroke="#0c0b09"/>
      <rect x="517" y="140" width="35" height="14" rx="3" fill="url(#gMetal)" stroke="#0c0b09"/>
      <circle cx="105" cy="200" r="13" fill="#2c2a24" stroke="#0c0b09" stroke-width="3"/>
      <circle cx="105" cy="200" r="6" fill="#4a463f"/>
      <circle cx="534" cy="195" r="13" fill="#2c2a24" stroke="#0c0b09" stroke-width="3"/>
      <circle cx="534" cy="195" r="6" fill="#4a463f"/>

      <!-- 本体下部 -->
      <rect x="148" y="298" width="344" height="124" rx="14" fill="url(#gDark)" stroke="#0b0b08" stroke-width="2"/>
      <g fill="#0e0f0a">
        <rect x="420" y="312" width="52" height="7" rx="3"/>
        <rect x="420" y="324" width="52" height="7" rx="3"/>
        <rect x="420" y="336" width="52" height="7" rx="3"/>
      </g>
      <!-- 小さな操作パネル -->
      <rect x="332" y="360" width="120" height="40" rx="6" fill="#20221a" stroke="#0b0b08"/>
      <g>
        <rect x="344" y="370" width="9" height="9" fill="#c9a43c" opacity="0.85"/>
        <rect x="358" y="370" width="9" height="9" fill="#c9a43c" opacity="0.6"/>
        <rect x="344" y="384" width="9" height="9" fill="#a33c2c" opacity="0.8"/>
        <rect x="372" y="370" width="9" height="9" fill="#c9a43c" opacity="0.4"/>
        <rect x="404" y="372" width="34" height="20" rx="3" fill="#15160f" stroke="#3a3c31"/>
        <text x="421" y="387" text-anchor="middle" font-size="12" fill="#9b8f4a" font-family="monospace">88</text>
      </g>
      <!-- 脚 -->
      <rect x="130" y="420" width="14" height="42" fill="url(#gMetal)" stroke="#0c0b09"/>
      <rect x="118" y="456" width="40" height="10" rx="3" fill="url(#gMetal)" stroke="#0c0b09"/>
      <rect x="500" y="420" width="14" height="42" fill="url(#gMetal)" stroke="#0c0b09"/>
      <rect x="488" y="456" width="40" height="10" rx="3" fill="url(#gMetal)" stroke="#0c0b09"/>

      <!-- 車輪 -->
      <g>
        <circle cx="415" cy="430" r="50" fill="#26211a" stroke="#3d3628" stroke-width="11" stroke-dasharray="9 7"/>
        <circle cx="415" cy="430" r="31" fill="url(#gMetal)" stroke="#0c0b09" stroke-width="2"/>
        <circle cx="415" cy="430" r="9" fill="#57534a" stroke="#0c0b09" stroke-width="2"/>
        <circle cx="415" cy="411" r="3.5" fill="#171511"/>
        <circle cx="433" cy="424" r="3.5" fill="#171511"/>
        <circle cx="426" cy="445" r="3.5" fill="#171511"/>
        <circle cx="404" cy="445" r="3.5" fill="#171511"/>
        <circle cx="397" cy="424" r="3.5" fill="#171511"/>
      </g>

      <!-- ピストン (シリンダーの奥に入るので先に描く) -->
      <g class="piston" id="piston0">
        <rect x="219" y="92" width="12" height="100" fill="url(#gRod)"/>
        <rect x="208" y="56" width="34" height="44" rx="6" fill="#262622" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="211" y1="68" x2="239" y2="68" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="211" y1="78" x2="239" y2="78" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="211" y1="88" x2="239" y2="88" stroke="#0d0d0b" stroke-width="2"/>
        <rect x="212" y="50" width="26" height="8" rx="3" fill="#3a362e"/>
      </g>
      <g class="piston" id="piston1">
        <rect x="284" y="92" width="12" height="100" fill="url(#gRod)"/>
        <rect x="273" y="56" width="34" height="44" rx="6" fill="#262622" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="276" y1="68" x2="304" y2="68" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="276" y1="78" x2="304" y2="78" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="276" y1="88" x2="304" y2="88" stroke="#0d0d0b" stroke-width="2"/>
        <rect x="277" y="50" width="26" height="8" rx="3" fill="#3a362e"/>
      </g>
      <g class="piston" id="piston2">
        <rect x="349" y="92" width="12" height="100" fill="url(#gRod)"/>
        <rect x="338" y="56" width="34" height="44" rx="6" fill="#262622" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="341" y1="68" x2="369" y2="68" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="341" y1="78" x2="369" y2="78" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="341" y1="88" x2="369" y2="88" stroke="#0d0d0b" stroke-width="2"/>
        <rect x="342" y="50" width="26" height="8" rx="3" fill="#3a362e"/>
      </g>
      <g class="piston" id="piston3">
        <rect x="414" y="92" width="12" height="100" fill="url(#gRod)"/>
        <rect x="403" y="56" width="34" height="44" rx="6" fill="#262622" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="406" y1="68" x2="434" y2="68" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="406" y1="78" x2="434" y2="78" stroke="#0d0d0b" stroke-width="2"/>
        <line x1="406" y1="88" x2="434" y2="88" stroke="#0d0d0b" stroke-width="2"/>
        <rect x="407" y="50" width="26" height="8" rx="3" fill="#3a362e"/>
      </g>

      <!-- シリンダー(スリーブ) -->
      <g>
        <rect x="205" y="158" width="40" height="44" rx="5" fill="url(#gMetal)" stroke="#0c0b09" stroke-width="2"/>
        <rect x="201" y="152" width="48" height="11" rx="4" fill="#55504a" stroke="#0c0b09"/>
        <rect x="270" y="158" width="40" height="44" rx="5" fill="url(#gMetal)" stroke="#0c0b09" stroke-width="2"/>
        <rect x="266" y="152" width="48" height="11" rx="4" fill="#55504a" stroke="#0c0b09"/>
        <rect x="335" y="158" width="40" height="44" rx="5" fill="url(#gMetal)" stroke="#0c0b09" stroke-width="2"/>
        <rect x="331" y="152" width="48" height="11" rx="4" fill="#55504a" stroke="#0c0b09"/>
        <rect x="400" y="158" width="40" height="44" rx="5" fill="url(#gMetal)" stroke="#0c0b09" stroke-width="2"/>
        <rect x="396" y="152" width="48" height="11" rx="4" fill="#55504a" stroke="#0c0b09"/>
      </g>

      <!-- エンジンブロック(赤) -->
      <rect x="168" y="196" width="304" height="108" rx="9" fill="url(#gRed)" stroke="#2e0b0a" stroke-width="2"/>
      <rect x="168" y="196" width="304" height="14" rx="7" fill="#a8443c" opacity="0.55"/>
      <line x1="184" y1="238" x2="456" y2="238" stroke="#3c0f0d" stroke-width="3"/>
      <g opacity="0.9">
        <circle cx="196" cy="222" r="4" fill="#2e0b0a"/>
        <circle cx="444" cy="222" r="4" fill="#2e0b0a"/>
        <circle cx="196" cy="288" r="4" fill="#2e0b0a"/>
        <circle cx="444" cy="288" r="4" fill="#2e0b0a"/>
      </g>
      <!-- 警告ラベル -->
      <rect x="252" y="252" width="136" height="30" rx="3" fill="#5e1512" stroke="#c9b08a" stroke-width="1.5"/>
      <text x="320" y="266" text-anchor="middle" font-size="11" fill="#e6d3ab" letter-spacing="2" font-weight="bold">⚠ 危険 DANGER</text>
      <text x="320" y="278" text-anchor="middle" font-size="8" fill="#cbb98f" letter-spacing="1">関係者以外 操作禁止</text>

      <!-- 燃料ゲージ(緑) -->
      <rect x="132" y="218" width="30" height="14" rx="4" fill="#2c2a24" stroke="#0c0b09"/>
      <rect x="132" y="286" width="30" height="14" rx="4" fill="#2c2a24" stroke="#0c0b09"/>
      <rect class="gauge" x="136" y="228" width="22" height="62" rx="9" fill="url(#gGreen)" stroke="#10240c" stroke-width="2" filter="url(#glow)"/>
      <ellipse cx="142" cy="244" rx="3" ry="14" fill="#eaffdd" opacity="0.55"/>

      <!-- 真鍮パイプ -->
      <path d="M470,262 h36 v-70" stroke="url(#gBrass)" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="506" cy="192" r="9" fill="#8a683a" stroke="#493413" stroke-width="2"/>
      <path d="M168,272 h-20 v40" stroke="#5c584e" stroke-width="10" fill="none" stroke-linecap="round"/>

      <!-- ホースが前を横切る -->
      <path d="M180,308 C240,360 400,362 470,310" stroke="#191512" stroke-width="9" fill="none" opacity="0.95"/>

      <!-- ランプ -->
      <g id="lampGroup">
        <rect x="484" y="30" width="48" height="10" rx="3" fill="url(#gMetal)" stroke="#0c0b09"/>
        <rect x="468" y="16" width="40" height="30" rx="5" fill="#1f1d19" stroke="#000" transform="rotate(-14 488 31)"/>
        <polygon id="lampCone" points="484,44 300,320 640,320" fill="url(#gCone)" opacity="0"/>
        <ellipse id="lampGlow" cx="484" cy="44" rx="110" ry="76" fill="url(#gLamp)" opacity="0"/>
        <circle id="lampLens" cx="484" cy="42" r="12" fill="#2b2a24" stroke="#0c0b09" stroke-width="2"/>
      </g>

      <!-- 汚し(サビ・すす) -->
      <rect x="95" y="15" width="450" height="450" filter="url(#grunge)" opacity="0.5" pointer-events="none"/>
      <path d="M200,210 q6,40 2,88" stroke="#1c0f0c" stroke-width="7" fill="none" opacity="0.35"/>
      <path d="M430,214 q-4,44 3,86" stroke="#1c0f0c" stroke-width="9" fill="none" opacity="0.3"/>
      <ellipse cx="250" cy="415" rx="60" ry="26" fill="#0c0a07" opacity="0.35"/>
    </svg>

    <canvas id="sparks"></canvas>
  </div>

  <!-- ===== 下部: 進捗 ===== -->
  <div class="bottombar">
    <div class="pbar" id="mainBar"><div class="fill"></div><div class="ticks"></div></div>
    <div class="pct num" id="pct">0<span style="font-size:0.5em">%</span></div>
  </div>

  <!-- タッチ領域 -->
  <div class="touch-layer" id="touchLayer"></div>
  <div class="hint" id="hint" hidden>画面を長押しで 発電機を修理</div>

  <!-- スキルチェック -->
  <div class="skillcheck" id="skillcheck" hidden>
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="92" fill="rgba(0,0,0,0.6)" stroke="#3a332b" stroke-width="3"/>
      <circle id="scZoneGood" cx="100" cy="100" r="78" fill="none" stroke="#e8a33d" stroke-width="11"
              stroke-dasharray="0 490.1" transform="rotate(-90 100 100)"/>
      <circle id="scZoneGreat" cx="100" cy="100" r="78" fill="none" stroke="#ffffff" stroke-width="11"
              stroke-dasharray="0 490.1" transform="rotate(-90 100 100)"/>
      <g id="scNeedle">
        <line x1="100" y1="100" x2="100" y2="14" stroke="#f2efe8" stroke-width="4" stroke-linecap="round"/>
      </g>
      <circle cx="100" cy="100" r="6" fill="#f2efe8"/>
      <text id="scResult" x="100" y="108" text-anchor="middle" font-size="26" font-weight="bold"
            fill="#fff" opacity="0" style="letter-spacing:2px"></text>
    </svg>
    <div class="sc-caption" id="scCaption">光ったゾーンで タップ！</div>
  </div>

</main>

<!-- 完了時の光 -->
<div class="lightflood" id="lightflood"></div>

<!-- 状態オーバーレイ -->
<div class="overlay" id="overlayIdle" hidden>
  <div class="waiting-title">— 待機中 —</div>
  <p>
    スタッフの合図でゲームが始まる<br>
    画面を長押しすると 発電機の修理が進む<br>
    <span style="color:#a35b52">ただし… 修理音は殺人鬼にも聞こえている</span>
  </p>
  <button class="btn primary" id="soloStartBtn" hidden>▶ スタート（ひとりモード）</button>
</div>

<div class="overlay cleared" id="overlayCleared" hidden>
  <h1>ゲート開放</h1>
  <p>全発電機の復旧完了 —— 今すぐ脱出せよ</p>
</div>

<div class="overlay timeover" id="overlayTimeover" hidden>
  <h1>TIME OVER</h1>
  <p>発電機は間に合わなかった<br>霧が教室を呑み込んでいく ……</p>
</div>

<!-- 接続バナー -->
<div class="conn-banner" id="connBanner" hidden>
  <span>⚠ サーバーに接続できません（再接続中…）</span>
  <a id="soloLink" href="#">ひとりモードで動かす</a>
</div>

<div class="vignette" id="vignette"></div>
<div class="grain"></div>

<script>window.SFX_PRELOAD = ['repair', 'completed', 'explosion'];</script>
<script src="/js/audio.js"></script>
<script src="/js/net.js"></script>
<script src="/js/gen.js"></script>
</body>
</html>
